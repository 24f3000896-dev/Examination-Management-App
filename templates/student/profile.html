{% extends 'base.html' %}{% block title %}Profile{% endblock %}
{% block content %}
<h3>Edit Profile</h3>
<form method="post" class="card card-body shadow-sm col-md-6">
 <div class="mb-3"><label class="form-label">Email (cannot be changed)</label><input class="form-control" value="{{ g.user.email }}" disabled></div>
 <div class="mb-3"><label class="form-label">Name</label><input name="name" class="form-control" value="{{ g.user.name }}" required></div>
 <div class="mb-3"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ g.user.phone or '' }}"></div>
 <div class="mb-3"><label class="form-label">Department</label><input name="department" class="form-control" value="{{ g.user.department or '' }}"></div>
 <div class="mb-3"><label class="form-label">Roll no.</label><input name="roll_no" class="form-control" value="{{ g.user.roll_no or '' }}"></div>
 <div><button class="btn btn-primary">Save</button></div></form>
{% endblock %}
