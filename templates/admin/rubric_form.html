{% extends 'base.html' %}{% block content %}
<h3>Edit rubric criterion</h3>
<form method="post" class="card card-body shadow-sm col-md-6">
 <div class="mb-3"><label class="form-label">Criterion</label><input name="criterion" class="form-control" value="{{ r.criterion }}" required></div>
 <div class="row"><div class="col mb-3"><label class="form-label">Max marks</label><input type="number" step="any" min="0.01" name="max_marks" class="form-control" value="{{ '%g'|format(r.max_marks) }}" required></div>
 <div class="col mb-3"><label class="form-label">Weightage</label><input type="number" step="any" min="0" name="weightage" class="form-control" value="{{ '%g'|format(r.weightage) }}"></div></div>
 <div class="mb-3"><label class="form-label">Description</label><input name="description" class="form-control" value="{{ r.description or '' }}"></div>
 <div><button class="btn btn-primary">Save</button> <a class="btn btn-link" href="{{ url_for('admin.exam_detail', eid=r.exam_id) }}">Cancel</a></div></form>
{% endblock %}
